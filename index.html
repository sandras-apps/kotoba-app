<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotoba</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5EFE6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="A calm, fast multilingual dictionary. Data from Wiktionary. No AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EFE6;--card:#FCF9F4;--ink:#5A4A42;--muted:#8C7C72;--line:#E8DDCF;--pri:#9A6C5E;--pfill:#EBD6CA;--soft:#F1E5DA;--mean:#5E8793;--syn:#74926A;--ant:#B07285;--tr:#8E7AAB;--help:#A68A4E;--focus:#D9B48A;font-size:18px}
:root[data-size="0"]{font-size:16px}:root[data-size="2"]{font-size:21px}:root[data-size="3"]{font-size:24px}
:root[data-theme="dark"]{--bg:#2E2723;--card:#3A322D;--ink:#EADDD0;--muted:#B9A898;--line:#4B413A;--pri:#DDB9A9;--pfill:#5C4B42;--soft:#463C35;--mean:#9CC3CC;--syn:#B2CDA6;--ant:#E0AEBD;--tr:#C4B5DD;--help:#DCC48E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Noto Sans Sinhala",system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei","Yu Gothic",sans-serif;line-height:1.6;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding:10px 0 12px}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:8px;position:relative}
#brand{font-weight:700;font-size:1.15rem;color:var(--pri);text-decoration:none;margin-right:auto}
.ib{min-width:44px;height:44px;border-radius:12px;font-size:1.05rem;font-weight:700}
.ib{color:var(--pri)}.ib:hover{background:var(--soft)}
#form{display:flex;gap:8px;position:relative}
#q{flex:1;min-width:0;font:inherit;font-size:1.25rem;padding:12px 16px;border:2px solid var(--pfill);border-radius:14px;background:var(--card);color:var(--ink)}
#go{background:var(--pfill);color:var(--ink);font-weight:700;padding:0 20px;border-radius:14px}
#sug{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card);border:2px solid var(--pri);border-radius:14px;overflow:hidden;z-index:6}
main{padding:18px 0 40px;min-height:60vh}
.hint{color:var(--muted);font-size:1.05rem}
.shelf h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.msg{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;font-size:1.1rem}
.spin{display:inline-block;width:1em;height:1em;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.tabs,.focus{display:flex;gap:6px;flex-wrap:wrap}.tabs{margin-top:4px}
.tab{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700}
.tab.on{background:var(--pfill);color:var(--ink);border-color:var(--pfill)}
.word{margin:14px 0 10px}
.wl{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.word h1{font-size:2.7rem;line-height:1.25;margin:2px 0 4px;overflow-wrap:anywhere}
.word h1 small{font-size:1.2rem;color:var(--muted);font-weight:400}
.word h1 rt{font-size:.38em;font-weight:400;color:var(--muted)}
.roman{font-size:1.35rem;color:var(--tr);font-weight:700}
.ipa{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:1.1rem;font-family:"Noto Sans","Segoe UI",system-ui,sans-serif}
.ipa em{font-size:.8rem}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;min-height:44px}
.act:hover,.act.on{border-color:var(--pri);background:var(--soft)}
.focus{margin:16px 0 14px;background:var(--line);padding:4px;border-radius:14px;gap:4px;flex-wrap:nowrap;overflow-x:auto}
.focus button{flex:1;white-space:nowrap;padding:8px 12px;border-radius:10px;font-weight:700;font-size:.95rem;color:var(--muted)}
.focus button.on{background:var(--card);color:var(--pri)}
.card{background:var(--card);box-shadow:0 2px 10px rgba(160,110,70,.10);border-radius:18px;padding:16px 18px 18px;margin:0 0 14px;border-left:8px solid var(--c);--c:var(--muted)}
.card.mean{--c:var(--mean)}.card.syn{--c:var(--syn)}.card.ant{--c:var(--ant)}.card.tr{--c:var(--tr)}.card.help{--c:var(--help)}
.card>h2,.card>summary{margin:0 0 8px;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--c);font-weight:700}
.card>summary{cursor:pointer;margin:0}.card[open]>summary{margin-bottom:10px}
.card h3{font-size:.95rem;color:var(--muted);margin:14px 0 6px;font-weight:700}
.card.quiet{padding:12px 18px}.card.quiet p{margin:0}
#out[data-focus="mean"] .card:not([data-k="mean"]),#out[data-focus="nyms"] .card:not([data-k="nyms"]),#out[data-focus="tr"] .card:not([data-k="tr"]){display:none}
.senses{list-style:none;margin:0;padding:0}
.sense{display:flex;gap:12px;padding:8px 0}.sense+.sense{border-top:1px dashed var(--line)}
.sense.sub{margin-left:26px}
.extra{display:none!important}
.num{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--c);color:var(--card);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;margin-top:.2em}
.num.gen{background:var(--line);color:var(--ink)}
.def{margin:0;font-size:1.1rem}
.def a,.help a[data-w]{color:inherit;text-decoration:underline dotted var(--c);text-underline-offset:4px;cursor:pointer}
.lb,.rg,.cq,.cg{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:5px;vertical-align:middle;background:var(--line);color:var(--muted);letter-spacing:.02em}
.rg-a{background:#F0DDA8;color:#6A5220}.rg-b{background:#CFE3D2;color:#3F6149}
.ex{margin:8px 0 2px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--help) 11%,transparent);display:flex;flex-direction:column}
.ex-t{font-size:1.08rem}.ex-t b{color:var(--pri)}
.ex-r{color:var(--tr);font-size:.95rem}.ex-m{color:var(--muted);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:7px;padding:7px 13px;border-radius:12px;background:color-mix(in srgb,var(--c) 13%,transparent);border:2px solid transparent;font-size:1.08rem;font-weight:700;min-height:42px;text-align:left}
.chip:hover{border-color:var(--c)}
.chip.plain{background:var(--card);border-color:var(--line);font-weight:400}.chip.plain:hover{border-color:var(--pri)}
.chip.dim,.sense.dim{opacity:.5}
.chip .cq,.chip .cg,.chip .rg{margin:0}
.calt,.ctr{font-weight:400;font-size:.9rem;color:var(--muted)}.ctr{color:var(--tr)}
[lang="zh"].ct,[lang="ja"].ct,[lang="si"].ct,[lang="ko"].ct,[lang="ar"].ct,[lang="hi"].ct{font-size:1.25rem}
.nrow{display:flex;gap:12px;padding:6px 0;align-items:flex-start}
.muted{color:var(--muted)}
.pivots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.pv{padding:5px 12px;border-radius:999px;border:2px solid var(--line);font-weight:700}.pv.on{background:color-mix(in srgb,var(--tr) 22%,transparent);border-color:var(--tr)}
.tg{padding:6px 0 10px}.tg+.tg{border-top:1px dashed var(--line)}
.tg h3{font-weight:400;color:var(--ink);font-size:1rem}
.trow{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.tl{flex:none;width:5.6em;font-size:.85rem;font-weight:700;color:var(--muted);padding-top:.75em}
.morebtn{margin-top:8px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);font-weight:700;color:var(--c)}
.help p{margin:6px 0}.help ul{margin:4px 0;padding-left:20px}
.ext{color:var(--c);font-weight:700}
footer{color:var(--muted);font-size:.85rem;padding:0 0 30px;text-align:center}
dialog{border:0;border-radius:18px;padding:22px;max-width:min(560px,92vw);width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(120,80,50,.4)}
dialog h2{margin:0 0 6px}dialog h3{margin:18px 0 8px;font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px}
.lgrid label{display:flex;align-items:center;gap:8px;padding:6px 4px;font-weight:700;cursor:pointer}
.lgrid input{width:22px;height:22px;accent-color:var(--pri)}.lgrid small{font-weight:400;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}.seg button.on{background:var(--card);color:var(--pri)}
.done{margin-top:22px;width:100%;padding:13px;border-radius:12px;background:var(--pfill);color:var(--ink);font-weight:700}
@media (max-width:520px){.word h1{font-size:2.2rem}.trow{flex-direction:column;gap:2px}.tl{width:auto;padding:0}#go{padding:0 14px}}
#q:focus{border-color:var(--pri);outline:none}

/* welcome */
body.welcoming #form,body.welcoming #bfav,body.welcoming #bset{visibility:hidden}
body.welcoming .top{border-bottom-color:transparent}
.welcome{max-width:560px;margin:0 auto;padding-bottom:10px}
.welcome .wui{max-width:240px;margin:0 0 0 auto}
.wlogo{text-align:center;margin-top:8px}
.welcome h1{text-align:center;font-size:2rem;line-height:1.25;margin:6px 0 4px}
.wsub{text-align:center;color:var(--muted);font-size:1.15rem;margin:0 0 22px}
.wsteps{list-style:none;padding:0;margin:0 0 26px;display:flex;flex-direction:column;gap:12px}
.wsteps li{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-radius:16px;padding:14px 16px;font-size:1.08rem;box-shadow:0 2px 10px rgba(160,110,70,.08)}
.wn{flex:none;width:2em;height:2em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--card)}
.c-mean{background:var(--mean)}.c-syn{background:var(--syn)}.c-ant{background:var(--ant)}
.welcome h2{font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 10px}
.chip.wl{font-weight:700}
.chip.wl.on{background:var(--pfill);border-color:var(--pfill)}
.chip.wl.on::before{content:'✓';color:var(--pri)}
.small{font-size:.92rem}.center{text-align:center}
.done.big{font-size:1.15rem;padding:15px;margin-top:14px}
.linkbtn{display:inline-block;margin-top:14px;padding:8px 2px;color:var(--pri);font-weight:700;text-decoration:underline;text-underline-offset:4px}
/* favourites */
.fhead{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.fhead h1{font-size:2rem;margin:0}
.count{background:var(--pfill);border-radius:999px;padding:2px 12px;font-weight:700}
.ffilt{margin-bottom:12px}.ffilt small{font-weight:400;opacity:.8}
.favlist{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.fav{display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;background:var(--card);border-radius:16px;padding:6px 8px 6px 4px;box-shadow:0 2px 10px rgba(160,110,70,.08)}
.fopen{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 12px;border-radius:12px}
.fopen:hover{background:var(--soft)}
.fw{font-size:1.4rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ftr{color:var(--tr);font-size:1rem}
.fg{color:var(--muted);font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.flang{flex:none;font-size:.8rem;font-weight:700;color:var(--muted);background:var(--soft);border-radius:8px;padding:2px 8px}
.fx{flex:none;width:44px;height:44px;border-radius:12px;color:var(--muted);font-size:1.1rem}
.fx:hover{background:var(--soft);color:var(--ant)}
.toast{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--pfill);border-radius:14px;padding:10px 16px;margin-bottom:12px;font-weight:700}
.toast button{color:var(--pri);text-decoration:underline;text-underline-offset:4px;font-weight:700}

/* suggestions with languages */
#sug{max-height:70vh;overflow-y:auto}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px}
#sug .srow+.srow{border-top:1px solid var(--line)}
.sw{font-size:1.15rem;font-weight:700;padding:4px 6px;border-radius:8px;text-align:left}
.sw:hover{background:var(--soft)}
.slangs{display:flex;flex-wrap:wrap;gap:6px}
.sl{font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink);min-height:32px}
.sl i{font-weight:400;color:var(--muted)}
.sl:hover{background:var(--pfill)}
.slist{background:var(--card);border-radius:14px;margin-top:8px}
.slist .srow+.srow{border-top:1px solid var(--line)}
.snote{position:sticky;bottom:0;margin:0;padding:10px 14px;border-top:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:.92rem;line-height:1.45}
.snote b{color:var(--ink)}

/* text size picker */
#sizepop{position:absolute;right:0;top:100%;z-index:8;background:var(--card);border-radius:16px;padding:10px;box-shadow:0 8px 28px rgba(110,70,40,.18);width:250px;display:flex;flex-direction:column;gap:4px}
#sizepop[hidden]{display:none}
#sizepop p{margin:2px 8px 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
#sizepop button{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;text-align:left;font-weight:700;font-size:16px;color:var(--ink)}
#sizepop button:hover{background:var(--soft)}
#sizepop button.on{background:var(--pfill)}
#sizepop button.on::after{content:'✓';margin-left:auto;color:var(--pri)}
.sa{width:34px;text-align:center;color:var(--pri);font-weight:700;line-height:1}
.sa.s0{font-size:15px}.sa.s1{font-size:19px}.sa.s2{font-size:24px}.sa.s3{font-size:29px}
/* home */
.hello{font-size:1.7rem;margin:4px 0 0}
.wotd{--c:var(--help);padding-bottom:14px}
.wotdbtn{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:4px 0;border-radius:12px}
.ww{font-size:2rem;font-weight:700;line-height:1.25}
.fg2{color:var(--muted);font-size:1.02rem;margin-top:2px}
.go{margin-top:8px;color:var(--pri);font-weight:700}
.surprise{margin:0 0 6px}
/* word page extras */
.didyou{background:var(--soft);border-radius:14px;padding:10px 14px;margin:6px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.asked{color:var(--muted);margin:4px 0 8px}
.linkbtn.inline{margin:0;padding:0 2px}
.mynote{background:color-mix(in srgb,var(--help) 12%,var(--card));border-radius:14px;padding:10px 14px;margin:8px 0 4px}
.mynote p{margin:2px 0 0;white-space:pre-wrap}
.chips .morebtn{margin-top:0;min-height:42px}
.act:disabled{opacity:.7;cursor:default}
/* toast */
#toastbar{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;max-width:min(92vw,520px);font-weight:700;transition:.25s;z-index:20;text-align:center}
#toastbar.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toastbar{transition:none}}
/* favourites: notes & review */
.fnote{color:var(--help);font-size:.95rem;font-style:italic;white-space:pre-wrap;text-align:left}
.fnoteedit{flex-basis:100%;padding:0 12px 6px}
.fnoteedit .linkbtn{margin-top:0;padding:2px}
.fnoteedit textarea{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:2px solid var(--pfill);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical;margin:4px 0 8px}
.fnoteedit textarea:focus{outline:none;border-color:var(--pri)}
.linkbtn.small{font-size:.9rem}
.fhead{flex-wrap:wrap}.fhead .review{margin-left:auto}
.rprog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.rprog span{display:block;height:100%;background:var(--syn);border-radius:99px;transition:width .3s}
.rcard{background:var(--card);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 4px 18px rgba(160,110,70,.12);margin-top:8px}
.rw{font-size:3rem;font-weight:700;line-height:1.2;margin:6px 0;overflow-wrap:anywhere}
.rans{margin:18px 0 6px;font-size:1.2rem}
.rans p{margin:6px 0}
.acts.center{justify-content:center}
.rk{border-color:var(--syn)}.rk:hover{background:color-mix(in srgb,var(--syn) 15%,transparent)}
.ra{border-color:var(--pfill)}
.rcard.done .big{font-size:3rem}
.rcard.done h1{margin:4px 0}
.sw.kb{background:var(--pfill)}
.sw .ftr{font-weight:400;font-size:.95rem;margin-left:6px}
.wvars h3{font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
#set .seg{flex-wrap:wrap}
.act.busy{opacity:.6}
#toastbar{line-height:1.45}

/* (i) note for languages without audio */
.infobtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--pri);font-weight:700;font-style:italic;font-family:Georgia,serif;font-size:1.15rem}
.infobtn:hover,.infobtn.on{border-color:var(--pri);background:var(--soft)}
.infotext{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--soft);color:var(--ink);max-width:560px}

/* Italian meanings */
.card h2 .src{font-size:.72rem;letter-spacing:.02em;text-transform:none;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.enmeans{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.enmeans summary{cursor:pointer;color:var(--pri);font-weight:700;padding:6px 0}
.itmode .card.syn .nrow .num:not(.gen),.itmode .card.ant .nrow .num:not(.gen){display:none}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="bar"><a href="#" id="brand">Kotoba</a>
    <button class="ib" id="bfav" aria-label="Favourites">★</button>
    <button class="ib" id="bsize" aria-label="Text size" aria-haspopup="true" aria-expanded="false">Aa</button>
    <button class="ib" id="btheme" aria-label="Theme">◐</button>
    <button class="ib" id="bset" aria-label="Settings">⚙</button>
    <div id="sizepop" hidden></div></div>
  <form id="form" autocomplete="off"><input id="q" type="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Word"><button id="go" type="submit">Cerca</button><div id="sug" hidden></div></form>
</div></div>
<main class="wrap" id="out"></main>
<footer class="wrap"><span id="src"></span></footer>
<dialog id="set"></dialog>
<script>
/* ===== Core: data from en.wiktionary.org (CC BY-SA). No AI. ===== */
const LANGS = [
  {c:'it', wk:'Italian',   n:'Italiano',  it:'Italiano',   sp:'it-IT'},
  {c:'en', wk:'English',   n:'English',   it:'Inglese',    sp:'en-US'},
  {c:'es', wk:'Spanish',   n:'Español',   it:'Spagnolo',   sp:'es-ES'},
  {c:'zh', wk:'Chinese',   n:'中文',       it:'Cinese',     sp:'zh-CN', tw:'Mandarin'},
  {c:'ja', wk:'Japanese',  n:'日本語',     it:'Giapponese', sp:'ja-JP'},
  {c:'fr', wk:'French',    n:'Français',  it:'Francese',   sp:'fr-FR'},
  {c:'si', wk:'Sinhalese', n:'සිංහල',     it:'Singalese',  sp:'si-LK'},
  {c:'ca', wk:'Catalan',   n:'Català',    it:'Catalano',   sp:'ca-ES'},

async function getDoc(title){

    const lg = e.getAttribute('lang') || '';
    if(e.classList.contains('tr') || /-Latn$/.test(lg)){ if(cur && !cur.tr) cur.tr = txt(e); return; }
    if(e.classList.contains('gender')){ if(cur) cur.g = txt(e); return; }

async function lookup(word, codes, exact){

  let first = null;
  for(const w of order){
    const d = await getDoc(w); if(!d) continue;
    const res = await fromDoc(d);
    if(!first) first = res;
    if(!codes || codes.some(c => res.entries[c])){ if(w !== word) res.asked = word; return res; }

async function fromDoc(d){
  const secs = sections(d.root), entries = {}, others = [];
  for(const [name, els] of secs){
    const L = BY_WK[name];

    let E = build(els, L.c, d.title);
    if(!E.pos.length && E.see){

      if(s2){ E = build(s2, L.c, d2.title); E.typed = d.title; }

function regionBadge(r){ return r ? '<span class="rg ' + (['ES', 'PT', 'UK', 'FR'].includes(r) ? 'rg-a' : 'rg-b') + '">' + (r === 'LA' ? 'LATAM' : r) + '</span>' : ''; }
function varBlocks(langs, attr){
  return langs.filter(c => VOPTS[c]).map(c => '<h3>' + t('vq_' + c) + '</h3><div class="seg">' + VOPTS[c].map(v =>
    '<button ' + attr + '="' + c + '" data-val="' + v + '" class="' + (pref(c) === v ? 'on' : '') + '">' + t(v) + '</button>').join('') + '</div>').join('');
}
function chip(x, lc, kind){
  const dim = off(x.r, lc), sw = trad(lc) && x.alt;
  return '<button class="chip ' + (kind || '') + (dim ? ' dim' : '') + '" data-w="' + esc(x.w || x.t) + '" data-l="' + lc + '">' +
    '<span class="ct" lang="' + lc + '">' + esc(sw ? x.alt : x.t) + '</span>' +
    (x.alt ? '<span class="calt" lang="' + lc + '">' + esc(sw ? x.t : x.alt) + '</span>' : '') +
    (x.tr ? '<span class="ctr">' + esc(x.tr) + '</span>' : '') +
    (x.g ? '<span class="cg">' + esc(x.g) + '</span>' : '') +
    (x.r ? regionBadge(x.r) : (x.q ? '<span class="cq">' + esc(x.q.slice(0, 28)) + '</span>' : '')) + '</button>';
}
function wordChips(list){
  return list.map(x => '<button class="chip plain" data-w="' + esc(x.w) + '" data-l="' + (x.l || '') + '">' + esc(x.w) +
    (x.l ? '<span class="cq">' + x.l.toUpperCase() + '</span>' : '') + '</button>').join('');
}
/* A suggestion: the word, then one button per language it exists in. */
function sugRow(x){
  const one = x.langs.length === 1 ? x.langs[0].c : '';
  return '<div class="srow"><button type="button" class="sw" data-w="' + esc(x.w) + '" data-l="' + one + '"><span lang="' + one + '">' + esc(x.w) + '</span>' +
    (x.tr && x.tr !== x.w ? ' <span class="ftr">' + esc(x.tr) + '</span>' : '') + '</button>' +
    '<span class="slangs">' + x.langs.map(l => '<button type="button" class="sl" data-w="' + esc(x.w) + '" data-l="' + l.c + '">' +
      esc(langName(l.c)) + (l.form ? ' <i>· ' + t('form') + '</i>' : '') + '</button>').join('') + '</span></div>';
}
function sugList(list){
  return list.map(sugRow).join('') + (list.some(x => x.langs.some(l => l.form)) ? '<p class="snote">' + t('formNote') + '</p>' : '');
}
function scriptOf(w, avail){
  const has = c => avail.includes(c);
  if(/[඀-෿]/.test(w) && has('si')) return 'si';
  if(/[぀-ヿ]/.test(w) && has('ja')) return 'ja';
  if(/[一-鿿]/.test(w)) return S.last === 'ja' && has('ja') ? 'ja' : has('zh') ? 'zh' : has('ja') ? 'ja' : null;
  if(/[가-힯]/.test(w) && has('ko')) return 'ko';
  if(/[Ѐ-ӿ]/.test(w) && has('ru')) return 'ru';
  if(/[؀-ۿ]/.test(w) && has('ar')) return 'ar';
  if(/[ऀ-ॿ]/.test(w) && has('hi')) return 'hi';
  return null;
}

function message(html){ out.innerHTML = '<div class="msg">' + html + '</div>'; }

async function search(w, hint, exact){
  w = (w || '').trim(); if(!w) return home();
  const my = ++token; input.value = w; sug.hidden = true;
  message('<span class="spin"></span>' + t('loading'));
  let r;
  try{ r = await Core.lookup(w, S.langs, exact); }catch(e){ if(my === token) message(t('net')); return; }
  if(my !== token) return;
  if(!r){
    const [sg0, scr] = await Promise.all([Core.suggest(w, S.langs), Core.scriptSuggest(w, S.langs).catch(() => [])]);
    if(my !== token) return;
    if(scr.length === 1 && hint !== 'nojump') return search(scr[0].w, scr[0].langs[0].c);
    const sg = scr.concat(sg0.filter(x => x.w !== w));
    return message(t('notFound') + ' <b>“' + esc(w) + '”</b>.' + (sg.length ? '<p>' + t('maybe') + '</p><div class="slist">' + sugList(sg) + '</div>' : ''));
  }
  const avail = S.langs.filter(c => r.entries[c]);
  if(!avail.length){
    const scr = await Core.scriptSuggest(w, S.langs).catch(() => []);
    if(my !== token) return;
    if(scr.length) return message(t('inScript') + '<div class="slist">' + sugList(scr) + '</div>');
    const known = Object.keys(r.entries);
    const names = known.map(langName).concat(r.others).slice(0, 12);
    return message(t('noLang') + (names.length ? '<p>' + t('also') + ' ' + esc(names.join(', ')) + '</p>' : '') +
      (known.length ? '<div class="chips">' + known.map(c => '<button class="chip plain" data-enable="' + c + '" data-ew="' + esc(r.title) + '">+ ' + t('enable') + ' ' + esc(langName(c)) + '</button>').join('') + '</div>' : ''));
  }
  const size = c => r.entries[c].pos.reduce((n, p) => n + p.senses.length, 0) + (c === S.last ? 0.5 : 0);
  const richest = avail.slice().sort((a, b) => size(b) - size(a))[0];
  const cur = hint && avail.includes(hint) ? hint : scriptOf(r.title, avail) || richest;
  R = {r, avail, cur, pivot: null, itm: {}}; view = 'word';
  await ensureIt(cur); if(my !== token) return;
  focus = 'all';
  if(decodeURIComponent(location.hash.slice(1)) !== r.title) location.hash = encodeURIComponent(r.title);
  show();
  didYouMean(w, my);
}
async function ensureIt(lc){
  if(S.ui !== 'it' || !R || lc in R.itm) return;
  const E = R.r.entries[lc];
  R.itm[lc] = await Promise.race([Core.itMeanings([E.typed, E.word, R.r.asked && R.r.asked.toLowerCase()], lc).catch(() => null), new Promise(r => setTimeout(() => r(null), 3500))]);
}

  if(IT){

async function loadTrans(){
  const my = token, E = R.r.entries[R.cur], lc = R.cur, box = $('#trbox');
  const targets = S.langs.filter(c => c !== lc && c !== 'en');
  let pivots = [], word = E.word, wantPos = null;
  if(lc !== 'en'){
    E.pos.forEach(p => p.senses.forEach(s => { const k = s.links[0]; if(k && pivots.length < 6 && !pivots.some(x => x.w === k)) pivots.push({w: k, pos: p.name.replace(/ \d+$/, '')}); }));
    if(!pivots.length){ box.innerHTML = '<p class="muted">' + t('noTrans') + '</p>'; return; }
    const pv = pivots.find(x => x.w === R.pivot) || pivots[0];
    word = pv.w; wantPos = pv.pos; R.pivot = pv.w;
  }
  let groups = [];
  try{ groups = await Core.translations(word, targets); }catch(e){ if(my === token) box.innerHTML = '<p class="muted">' + t('net') + '</p>'; return; }
  if(my !== token || !$('#trbox')) return;
  if(wantPos){ const m = groups.filter(g => g.pos.replace(/ \d+$/, '') === wantPos); if(m.length) groups = m; }
  let h = '';
  if(lc !== 'en') h += '<div class="pivots"><span class="muted">' + t('via') + '</span> ' + pivots.map(p =>
    '<button class="pv' + (p.w === word ? ' on' : '') + '" data-pivot="' + esc(p.w) + '" lang="en">' + esc(p.w) + '</button>').join('') + '</div>';
  if(!groups.length) h += '<p class="muted">' + t('noTrans') + '</p>';
  const grp = (g, extra) => {
    let s = '<div class="tg' + (extra ? ' extra' : '') + '"><h3 lang="en">' + (lc !== 'en' ? '<b>' + esc(word) + '</b> · ' : '') + esc(g.gloss || '') + (g.via ? ' <span class="muted">· ' + t('via2') + ' ' + esc(g.via) + '</span>' : '') + '</h3>';
    targets.forEach(c => {
      let ts = g.by[c]; if(!ts) return;
      if(regional(c)) ts = ts.slice().sort((a, b) => (off(a.r, c) ? 1 : 0) - (off(b.r, c) ? 1 : 0));
      s += '<div class="trow"><span class="tl">' + esc(Core.BY_C[c].n) + '</span><div class="chips">' + ts.slice(0, 8).map(x => chip(x, c, 'trc')).join('') + '</div></div>';
    });
    return s + '</div>';
  };
  groups.forEach((g, i) => { h += grp(g, i >= 3); });
  if(groups.length > 3) h += '<button class="morebtn" data-more>' + t('otherSenses') + ' (' + (groups.length - 3) + ')</button>';
  box.innerHTML = h;
}

/* listen: recorded audio from Wiktionary when there is one, else the device voice */
async function speak(){
  const lang = (VSP[R.cur] && VSP[R.cur][pref(R.cur)]) || Core.BY_C[R.cur].sp;
  let voices = 'speechSynthesis' in window ? speechSynthesis.getVoices() : [];
  if('speechSynthesis' in window && !voices.length){
    await new Promise(r => { speechSynthesis.addEventListener('voiceschanged', r, {once: true}); setTimeout(r, 1200); });
    voices = speechSynthesis.getVoices();
  }
  const has = voices.some(v => v.lang.replace('_', '-').toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
  if(!has){ toast(t(R.cur === 'si' ? 'noVoiceSi' : 'noVoice')); return; }
  const E = R.r.entries[R.cur], u = new SpeechSynthesisUtterance(E.typed || E.word);
  u.lang = lang; u.voice = voices.find(v => v.lang.replace('_', '-') === lang) || voices.find(v => v.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase())); u.rate = 0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
/* Lingua Libre: volunteers' recordings on Wikimedia Commons, used when Wiktionary has none */
const LLQ = {it: 'Q652', en: 'Q1860', es: 'Q1321', zh: 'Q9192', ja: 'Q5287', fr: 'Q150', si: 'Q13267', ca: 'Q7026', de: 'Q188', pt: 'Q5146', ru: 'Q7737', ar: 'Q13955', hi: 'Q1568', ko: 'Q9176'};
async function linguaLibre(word, lc){
  const C = 'https://commons.wikimedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query';
  try{
    const r = await (await fetch(C + '&list=search&srnamespace=6&srlimit=10&srsearch=' + encodeURIComponent('intitle:"LL-' + LLQ[lc] + '" intitle:"' + word + '"'))).json();
    const f = ((r.query || {}).search || []).map(x => x.title).find(ti => ti.endsWith('-' + word + '.wav') || ti.endsWith('-' + word + '.ogg'));
    if(!f) return null;
    const i = await (await fetch(C + '&prop=imageinfo&iiprop=url&titles=' + encodeURIComponent(f))).json();
    return ((i.query.pages[0].imageinfo || [])[0] || {}).url || null;
  }catch(e){ return null; }
}
async function listen(b){
  const E = R.r.entries[R.cur]; let a = E.audio;
  if(regional(R.cur)){ const m = a.filter(x => x.r === pref(R.cur)); a = m.length ? m : a.filter(x => !off(x.r, R.cur)); }
  let src = a.length ? a[0].src : null;
  if(!src && LLQ[R.cur]){ if(b) b.classList.add('busy'); src = await linguaLibre(E.typed || E.word, R.cur); if(b) b.classList.remove('busy'); }
  if(!src) return speak();
  try{ new Audio(src).play().catch(speak); }catch(e){ speak(); }
}

sug.addEventListener('mousedown', e => e.preventDefault());

/* ===== Welcome ===== */
const WELCOME_LANGS = ['it','en','es','zh','ja','fr','si','ca','de','pt','ru','ar','hi','ko'];

    '<div class="wlogo" aria-hidden="true">' + LOGO + '</div>' +
    '<h1>' + t('wTitle') + '</h1><p class="wsub">' + t('wSub') + '</p>' +

    '<h2>' + t('wLangs') + '</h2><div class="chips wlangs">' +
    WELCOME_LANGS.map(c => '<button class="chip plain wl' + (S.langs.includes(c) ? ' on' : '') + '" data-wl="' + c + '" aria-pressed="' + S.langs.includes(c) + '"><span lang="' + c + '">' + esc(Core.BY_C[c].n) + '</span>' +
      (Core.BY_C[c].n !== langName(c) ? '<span class="cq">' + esc(langName(c)) + '</span>' : '') + '</button>').join('') + '</div>' +
    '<div class="wvars">' + varBlocks(S.langs, 'data-wvar') + '</div>' +
    '<p class="muted small">' + t('wLater') + '</p>' +
    '<button class="done big" data-start>' + t('start') + ' →</button>' +

}
const LOGO = '<svg viewBox="0 0 120 120" width="88" height="88"><rect x="24" y="28" width="72" height="51" rx="13" fill="var(--pfill)"/><path d="M43 77 L39 96 L60 78 Z" fill="var(--pfill)"/>' +
  '<rect x="35" y="40" width="48" height="6" rx="3" fill="var(--mean)"/><rect x="35" y="51" width="36" height="6" rx="3" fill="var(--syn)"/><rect x="35" y="62" width="43" height="6" rx="3" fill="var(--ant)"/></svg>';

/* ===== Favourite words ===== */
function favs(){
  R = null; token++; view = 'favs'; input.value = '';
  document.body.classList.remove('welcoming');
  if(location.hash) history.replaceState(null, '', location.pathname + location.search);
  const langs = [...new Set(S.saved.map(x => x.l))].filter(c => Core.BY_C[c]);
  if(favFilter !== 'all' && !langs.includes(favFilter)) favFilter = 'all';
  const list = S.saved.filter(x => favFilter === 'all' || x.l === favFilter);
  let h = '<button class="linkbtn" data-nav="home">' + t('back') + '</button>' +
    '<header class="fhead"><h1>★ ' + t('favs') + '</h1><span class="count">' + S.saved.length + '</span>' +
    (S.saved.length ? '<button class="act review" data-review>🧠 ' + t('review') + '</button>' : '') + '</header>';
  if(lastRemoved) h += '<div class="toast">' + t('removed') + ' <button data-undo>' + t('undo') + '</button></div>';
  if(!S.saved.length){ out.innerHTML = h + '<div class="msg">' + t('favsEmpty') + '</div>'; return; }
  if(langs.length > 1) h += '<nav class="tabs ffilt">' + ['all'].concat(langs).map(c =>
    '<button class="tab' + (favFilter === c ? ' on' : '') + '" data-ff="' + c + '">' + (c === 'all' ? t('allL') : esc(Core.BY_C[c].n)) +
    ' <small>' + (c === 'all' ? S.saved.length : S.saved.filter(x => x.l === c).length) + '</small></button>').join('') + '</nav>';
  h += '<ul class="favlist">' + list.map(x => {
    const L = Core.BY_C[x.l];
    return '<li class="fav"><button class="fopen" data-w="' + esc(x.w) + '" data-l="' + esc(x.l || '') + '">' +
      '<span class="fw" lang="' + esc(x.l || '') + '">' + esc(x.s || x.w) + '</span>' +
      (x.tr ? '<span class="ftr">' + esc(x.tr) + '</span>' : '') +
      (x.g ? '<span class="fg">' + esc(x.g) + '</span>' : '') +
      (x.note ? '<span class="fnote">📝 ' + esc(x.note) + '</span>' : '') +
      '</button><span class="flang">' + (L ? esc(L.n) : '') + '</span>' +
      '<button class="fx" data-unfav="' + esc(x.w) + '" data-ul="' + esc(x.l || '') + '" aria-label="' + t('remove') + '" title="' + t('remove') + '">✕</button>' +
      '<div class="fnoteedit"><button class="linkbtn small" data-noteopen="' + esc(x.w) + '" data-ul="' + esc(x.l || '') + '">' + (x.note ? t('editNote') : t('addNote')) + '</button></div></li>';
  }).join('') + '</ul>';
  h += '<div class="acts"><button class="act" data-copyfavs>⧉ ' + t('copyList') + '</button></div>';
  out.innerHTML = h;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-nav],[data-wl],[data-wvar],[data-wui],[data-start],[data-ff],[data-unfav],[data-undo],[data-copyfavs]');
  if(!b || b.closest('#set')) return;
  const d = b.dataset;
  if(d.nav === 'home'){ lastRemoved = null; home(); }
  else if(d.nav === 'favs'){ favs(); }
  else if(d.wl){
    const on = new Set(S.langs); on.has(d.wl) ? on.delete(d.wl) : on.add(d.wl);
    if(!on.size) return;
    S.langs = Core.LANGS.map(L => L.c).filter(x => on.has(x)); store.set('langs', S.langs);
    const y = window.scrollY; welcome(true); window.scrollTo(0, y);
  }
  else if(d.wvar){ S.vars[d.wvar] = d.val; store.set('vars', S.vars); b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }
  else if(d.wui){ S.ui = d.wui; store.set('ui', S.ui); applyPrefs(); welcome(true); }
  else if('start' in d){ store.set('welcomed', true); home(); input.focus(); }
  else if(d.ff){ favFilter = d.ff; lastRemoved = null; favs(); }
  else if(d.unfav !== undefined){
    const i = S.saved.findIndex(x => x.w === d.unfav && (x.l || '') === d.ul);
    if(i < 0) return;
    lastRemoved = {item: S.saved[i], i};
    S.saved.splice(i, 1); store.set('saved', S.saved); favs();
  }
  else if('undo' in d){
    if(lastRemoved){ S.saved.splice(lastRemoved.i, 0, lastRemoved.item); store.set('saved', S.saved); }
    lastRemoved = null; favs();
  }
  else if('copyfavs' in d){
    const list = S.saved.filter(x => favFilter === 'all' || x.l === favFilter);
    const txt = list.map(x => (x.s || x.w) + (x.tr ? ' (' + x.tr + ')' : '') + (x.g ? ' — ' + x.g : '')).join('\n');
    try{ navigator.clipboard.writeText(txt).then(() => { b.textContent = '✓ ' + t('copied'); setTimeout(() => { b.textContent = '⧉ ' + t('copyList'); }, 1400); }, () => {}); }catch(err){}
  }
});

/* ===== small helpers ===== */
function toast(msg){
  let el = $('#toastbar'); if(!el){ el = document.createElement('div'); el.id = 'toastbar'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3600);
}
const plain = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
async function didYouMean(w, my){
  if(!/^[\p{L} '-]+$/u.test(w)) return;
  const [list, scr] = await Promise.all([Core.suggest(w, S.langs), Core.scriptSuggest(w, S.langs).catch(() => [])]);
  if(my !== token || !$('#didyou')) return;
  const hits = scr.concat(list.filter(x => x.w !== w && x.w.toLowerCase() !== w.toLowerCase() && plain(x.w) === plain(w)));
  if(hits.length) $('#didyou').innerHTML = '<div class="didyou">' + t('didYou') + ' ' + hits.slice(0, 3).map(x =>
    '<button class="chip plain" data-w="' + esc(x.w) + '" data-l="' + (x.langs.length === 1 ? x.langs[0].c : '') + '"><b lang="' + (x.langs[0] ? x.langs[0].c : '') + '">' + esc(x.w) + '</b>' + (x.tr && x.tr !== x.w ? '<span class="ctr">' + esc(x.tr) + '</span>' : '') +
    x.langs.map(l => '<span class="cq">' + esc(langName(l.c)) + '</span>').join('') + '</button>').join(' ') + '?</div>';
}
function seeded(str){ let h = 2166136261; for(const ch of str){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
const gloss = E => { const s0 = E.pos[0] && E.pos[0].senses[0]; return s0 ? s0.html.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').trim().slice(0, 110) : ''; };

/* ===== word of the day ===== */
async function loadWotd(){
  const my = token, day = new Date().toISOString().slice(0, 10);
  let W = store.get('wotd3', null);
  if(!W || W.d !== day || !S.langs.includes(W.l) || W.ui !== S.ui){
    const rnd = seeded(day + S.langs.join());
    const l = S.langs[Math.floor(rnd() * S.langs.length)];
    let res = null;
    try{ res = await Core.randomWord(l, rnd); }catch(e){}
    if(!res) return;
    let g = gloss(res.E);
    if(S.ui === 'it'){ const im = await Core.itMeanings([res.w], l).catch(() => null); if(im) g = im[0].senses[0].html.replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&amp;/g, '&').slice(0, 110); }
    W = {d: day, l, w: res.w, s: res.E.typed || res.E.word, tr: res.E.tr || '', g, ui: S.ui};
    store.set('wotd3', W);
  }
  const box = $('#wotd'); if(my !== token || !box) return;
  box.innerHTML = '<h2>✨ ' + t('wotd') + ' · ' + esc(langName(W.l)) + '</h2>' +
    '<button class="wotdbtn" data-w="' + esc(W.w) + '" data-l="' + W.l + '"><span class="ww" lang="' + W.l + '">' + esc(W.s) + '</span>' +
    (W.tr ? '<span class="ftr">' + esc(W.tr) + '</span>' : '') + (W.g ? '<span class="fg2">' + esc(W.g) + '</span>' : '') +
    '<span class="go">' + t('open') + ' →</span></button>';
  box.hidden = false;
}
async function surprise(b){
  const l = S.langs[Math.floor(Math.random() * S.langs.length)];
  b.disabled = true; b.innerHTML = '<span class="spin"></span>' + t('loading');
  let res = null; try{ res = await Core.randomWord(l, Math.random); }catch(e){}
  if(res) search(res.w, l, true); else { b.disabled = false; b.textContent = t('surprise'); toast(t('net')); }
}

/* ===== review (flashcards from favourite words) ===== */
let RV = null;
function startReview(){
  const pool = S.saved.filter(x => favFilter === 'all' || x.l === favFilter);
  const q = pool.slice().sort(() => Math.random() - 0.5).slice(0, 10).map(x => ({x, again: false}));
  RV = {q, i: 0, open: false, known: 0, total: q.length};
  view = 'review'; drawReview();
}
function drawReview(){
  window.scrollTo(0, 0);
  const back = '<button class="linkbtn" data-nav="favs">' + t('back') + '</button>';
  if(RV.i >= RV.q.length){
    out.innerHTML = back + '<section class="rcard done"><div class="big">🌿</div><h1>' + t('doneT') + '</h1><p>' +
      t('doneMsg').replace('{n}', RV.total === 1 ? t('word1') : t('wordN').replace('{n}', RV.total)).replace('{k}', RV.known) + '</p><div class="acts center"><button class="act" data-review>🧠 ' + t('reviewMore') + '</button>' +
      '<button class="act" data-nav="favs">' + t('toList') + '</button></div></section>';
    return;
  }
  const {x} = RV.q[RV.i], L = Core.BY_C[x.l];
  out.innerHTML = back + '<div class="rprog"><span style="width:' + Math.round(RV.i / RV.q.length * 100) + '%"></span></div>' +
    '<p class="muted center">' + (RV.i + 1) + ' ' + t('of') + ' ' + RV.q.length + '</p>' +
    '<section class="rcard"><div class="wl">' + (L ? esc(L.n) : '') + '</div><div class="rw" lang="' + esc(x.l || '') + '">' + esc(x.s || x.w) + '</div>' +
    (x.tr ? '<div class="roman">' + esc(x.tr) + '</div>' : '') +
    (RV.open ? '<div class="rans">' + (x.g ? '<p>' + esc(x.g) + '</p>' : '<p class="muted">' + t('noGloss') + '</p>') +
      (x.note ? '<p class="fnote">📝 ' + esc(x.note) + '</p>' : '') + '</div>' +
      '<div class="acts center"><button class="act rk" data-rknew>' + t('knew') + '</button><button class="act ra" data-ragain>' + t('again') + '</button></div>'
    : '<button class="done big" data-rreveal>' + t('reveal') + '</button>') + '</section>';
}

/* ===== notes on favourite words ===== */
function openNote(w, l, li){
  const x = S.saved.find(y => y.w === w && (y.l || '') === l); if(!x) return;
  const box = li.querySelector('.fnoteedit');
  box.innerHTML = '<textarea rows="3" placeholder="' + esc(t('notePh')) + '">' + esc(x.note || '') + '</textarea>' +
    '<button class="act" data-notesave="' + esc(w) + '" data-ul="' + esc(l) + '">' + t('saveNote') + '</button>';
  box.querySelector('textarea').focus();
}

document.addEventListener('click', e => {
  const ib = e.target.closest('[data-info]');
  if(ib){ const p = ib.closest('header').querySelector('.infotext'); p.hidden = !p.hidden; ib.setAttribute('aria-expanded', !p.hidden); ib.classList.toggle('on', !p.hidden); return; }
  const b = e.target.closest('[data-surprise],[data-enable],[data-review],[data-rreveal],[data-rknew],[data-ragain],[data-noteopen],[data-notesave]');
  if(!b) return;
  const d = b.dataset;
  if('surprise' in d) surprise(b);
  else if(d.enable){ if(!S.langs.includes(d.enable)){ S.langs = Core.LANGS.map(L => L.c).filter(c => c === d.enable || S.langs.includes(c)); store.set('langs', S.langs); } search(d.ew, d.enable); }
  else if('review' in d) startReview();
  else if('rreveal' in d){ RV.open = true; drawReview(); }
  else if('rknew' in d){ if(!RV.q[RV.i].again) RV.known++; RV.i++; RV.open = false; drawReview(); }
  else if('ragain' in d){ const it = RV.q[RV.i]; if(!it.again) RV.q.push({x: it.x, again: true}); RV.i++; RV.open = false; drawReview(); }
  else if(d.noteopen !== undefined) openNote(d.noteopen, d.ul, b.closest('li'));
  else if(d.notesave !== undefined){
    const x = S.saved.find(y => y.w === d.notesave && (y.l || '') === d.ul);
    if(x){ x.note = b.parentElement.querySelector('textarea').value.trim().slice(0, 600); store.set('saved', S.saved); }
    favs();
  }
});
document.addEventListener('keydown', e => {
  if(view !== 'review' || !RV || e.target.matches('input,textarea')) return;
  if(e.key === ' ' && !RV.open){ e.preventDefault(); RV.open = true; drawReview(); }
});

applyPrefs();
if(!store.get('welcomed', false)) welcome();
else if(location.hash.length > 1) search(decodeURIComponent(location.hash.slice(1)));
else home();

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
